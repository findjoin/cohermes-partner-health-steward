[Service]
# Lock the main process and the preflight to the same production interpreter.
Environment=HERMES_HOME=/root/.hermes/profiles/partner
ExecStart=
ExecStart=/usr/local/lib/hermes-agent/venv/bin/python -m hermes_cli.main --profile partner gateway run
ExecStartPre=/usr/local/lib/hermes-agent/venv/bin/python /root/.hermes/profiles/partner/scripts/verify_health_guard_preflight.py

# The Agent may propose changes, but the running root service cannot modify or
# replace the published health policy, guard, or deterministic reminder.
ReadOnlyPaths=/root/.hermes/profiles/partner/plugins/health-guard
ReadOnlyPaths=/root/.hermes/profiles/partner/plugins/health-autonomy
ReadOnlyPaths=/root/.hermes/profiles/partner/skills/health-steward
ReadOnlyPaths=/root/.hermes/profiles/partner/scripts/health_reminder_generic.py
ReadOnlyPaths=/root/.hermes/profiles/partner/scripts/health_autonomy_dispatch.py
ReadOnlyPaths=/root/.hermes/profiles/partner/scripts/verify_health_guard_preflight.py
ReadOnlyPaths=/root/.hermes/profiles/partner/config.yaml
ReadOnlyPaths=/root/.config/systemd/user/hermes-gateway-partner.service
ReadOnlyPaths=/root/.config/systemd/user/hermes-gateway-partner.service.d
CapabilityBoundingSet=~CAP_SYS_ADMIN
NoNewPrivileges=yes
UMask=0077
